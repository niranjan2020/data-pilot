services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: datapilot
      POSTGRES_PASSWORD: datapilot_local
      POSTGRES_DB: datapilot
    volumes:
      - datapilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datapilot -d datapilot"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.4
    volumes:
      - datapilot_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ENVIRONMENT: development
      HOST: 0.0.0.0
      PORT: 8000
      METADATA_DATABASE_URL: postgresql://datapilot:datapilot_local@postgres:5432/datapilot
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: datapilot_semantic
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - datapilot_api_secrets:/app/data/secrets
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: ..
      dockerfile: ui/Dockerfile
    ports:
      - "127.0.0.1:3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy

volumes:
  datapilot_postgres_data:
  datapilot_qdrant_data:
  datapilot_api_secrets:
